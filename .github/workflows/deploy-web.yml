name: Deploy Arena Combat Lab Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official Godot editor and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o /tmp/godot.zip
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot /tmp/templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Run headless Arena smoke test
        shell: bash
        run: |
          set -euxo pipefail
          LOG=/tmp/godot-smoke.log
          set +e
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --script res://tests/SmokeTest.gd 2>&1 | tee "$LOG"
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Arena smoke test exited with code $GODOT_EXIT"
            exit "$GODOT_EXIT"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|SMOKE FAIL' "$LOG"; then
            echo 'Arena smoke test reported an error; refusing to publish.'
            exit 1
          fi
          grep -q 'ARENA SMOKE OK' "$LOG"

      - name: Run headless Neon Driftline smoke test
        shell: bash
        run: |
          set -euxo pipefail
          LOG=/tmp/neon-smoke.log
          set +e
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path neon-driftline --script res://tests/SmokeTest.gd 2>&1 | tee "$LOG"
          GODOT_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "Neon Driftline smoke test exited with code $GODOT_EXIT"
            exit "$GODOT_EXIT"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|SMOKE FAIL' "$LOG"; then
            echo 'Neon Driftline smoke test reported an error; refusing to publish.'
            exit 1
          fi
          grep -q 'NEON DRIFTLINE SMOKE OK' "$LOG"

      - name: Run Tavern Keeper simulation tests
        shell: bash
        run: |
          set -euxo pipefail
          node --check tavern-keeper/core.js
          node --check tavern-keeper/app.js
          node tavern-keeper/tests/test_core.js
          node tavern-keeper/tests/test_preparation.js
          node tavern-keeper/tests/test_roster.js
          node tavern-keeper/tests/test_tavern.js
          node tavern-keeper/tests/test_crafting.js
          node tavern-keeper/tests/test_merchants.js
          node tavern-keeper/tests/test_contracts.js
          node tavern-keeper/tests/test_recruitment.js
          node tavern-keeper/tests/test_durability.js
          node tavern-keeper/tests/test_concurrency.js
          node tavern-keeper/tests/test_objectives.js
          node tavern-keeper/tests/test_facilities.js
          node tavern-keeper/tests/test_offline.js

      - name: Export Web builds and reject script errors
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web build/web/neon-driftline build/web/tavern-keeper
          SHORT_SHA="${GITHUB_SHA:0:12}"

          ARENA_BASENAME="arena-${SHORT_SHA}"
          ARENA_LOG=/tmp/godot-export-arena.log
          set +e
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path . --export-release Web "build/web/${ARENA_BASENAME}.html" \
            2>&1 | tee "$ARENA_LOG"
          ARENA_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$ARENA_EXIT" -ne 0 ]; then exit "$ARENA_EXIT"; fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$ARENA_LOG"; then exit 1; fi
          mv "build/web/${ARENA_BASENAME}.html" build/web/index.html
          test -f "build/web/${ARENA_BASENAME}.pck"

          NEON_BASENAME="neon-${SHORT_SHA}"
          NEON_LOG=/tmp/godot-export-neon.log
          set +e
          "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" \
            --headless --path neon-driftline --export-release Web "../build/web/neon-driftline/${NEON_BASENAME}.html" \
            2>&1 | tee "$NEON_LOG"
          NEON_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$NEON_EXIT" -ne 0 ]; then exit "$NEON_EXIT"; fi
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$NEON_LOG"; then exit 1; fi
          mv "build/web/neon-driftline/${NEON_BASENAME}.html" build/web/neon-driftline/index.html
          test -f "build/web/neon-driftline/${NEON_BASENAME}.pck"

          cp tavern-keeper/index.html tavern-keeper/app.js tavern-keeper/core.js tavern-keeper/styles.css build/web/tavern-keeper/
          test -f build/web/tavern-keeper/index.html
          test -f build/web/tavern-keeper/core.js
          touch build/web/.nojekyll

      - name: Keep downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-combat-lab-web
          path: build/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
