name: Install final Arena visual and roster layers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install prepared layers and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/2ec44033e9ac1ea12cf43a219e9d2dcc8156991f" \
            | jq -r '.content' | tr -d '\n' | base64 -d > scripts/MainArenaVisuals.gd
          printf '%s' '' | base64 -d > scripts/MainArenaSetup.gd
          sed -i 's#res://scripts/MainAlphaAI.gd#res://scripts/MainArenaSetup.gd#' main.tscn
          rm -f .github/workflows/install-arena-finish.yml
          git config user.name 'arena-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/MainArenaVisuals.gd scripts/MainArenaSetup.gd main.tscn .github/workflows/install-arena-finish.yml
          git commit -m 'Activate Arena visuals and creature roster UI'
          git push origin HEAD:main
