name: Fix mobile inference

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix map pan type inference
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/MainMobile.gd')
          text = p.read_text()
          old = '    var x := clamp(ideal_x, right_aligned, left_aligned)'
          new = '    var x: float = clampf(ideal_x, right_aligned, left_aligned)'
          if old not in text:
              raise SystemExit('target line not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'arena-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/MainMobile.gd
          git commit -m 'Fix mobile map pan inference'
          git push origin HEAD:main
