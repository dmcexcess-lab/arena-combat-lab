name: Fix Boundless type inference

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix local Variant inference declarations
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('scripts/MainBoundless.gd')
          text = p.read_text()
          fixed = re.sub(r'(^\s*var\s+[A-Za-z_][A-Za-z0-9_]*\s*):=', r'\1=', text, flags=re.M)
          p.write_text(fixed)
          print('changed', text != fixed)
      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/MainBoundless.gd; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'arena-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/MainBoundless.gd
          git commit -m 'Fix Boundless GDScript type inference'
          git push origin HEAD:main
