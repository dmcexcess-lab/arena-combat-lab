name: Install project context
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write project context and self-clean
        shell: bash
        run: |
          set -euo pipefail
          B64=''
          printf '%s' "$B64" | base64 -d | gzip -dc > PROJECT_CONTEXT.md
          rm -f .github/workflows/install-project-context.yml
          git config user.name 'arena-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PROJECT_CONTEXT.md .github/workflows/install-project-context.yml
          git commit -m 'Add current project context for AI handoff'
          git push origin HEAD:main
