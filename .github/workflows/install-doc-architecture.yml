name: Install compact project docs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install prepared documentation blobs and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1" path="$2"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
          }
          fetch_blob 17f90f912b6d9aabefe36f1231d19cd481f5e8c6 PROJECT_CONTEXT.md
          fetch_blob 841536d4b5e8561ae09fd4d25a516f11b14b0fbc README_SOPS.md
          fetch_blob 7e31dfcad77083c0076b221db17a9dc156decfd3 ROADMAP.md
          fetch_blob b4287db0ddd0992980e7177cb522491ecfc2da06 CHANGELOG.md
          rm -f .github/workflows/install-doc-architecture.yml
          git config user.name 'arena-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PROJECT_CONTEXT.md README_SOPS.md ROADMAP.md CHANGELOG.md .github/workflows/install-doc-architecture.yml
          git commit -m 'Organize and compact project documentation'
          git push origin HEAD:main
