name: Perception clarity pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch perception clarity
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/Main.gd')
          s = p.read_text()
          s = s.replace('var intent_reads := {}\nvar tick := 0', 'var intent_reads := {}\nvar last_seen := {}\nvar tick := 0', 1)
          s = s.replace('    sound_marks.clear()\n    stats = {', '    sound_marks.clear()\n    last_seen.clear()\n    stats = {', 1)

          old = '''func zombie_act(i: int):
    if zombies[i].dead: return
    var z = zombies[i]
    if zombie_sees(z):
        if z.state != "CHASE": alert(i)
        z.state = "CHASE"; z.target = player.pos; z.heard = player.pos
    if manhattan(z.pos,player.pos) == 1:
        z.facing = player.pos-z.pos; zombies[i]=z; zombie_attack(i); return
    var moved := false
    if z.state == "CHASE":
        z.target = player.pos; zombies[i]=z; moved = zombie_move(i,z.target)
    elif z.heard != Vector2i(-1,-1):
        z.state = "INVESTIGATE"; z.target = z.heard; zombies[i]=z
        if z.pos == z.target:
            zombies[i].heard = Vector2i(-1,-1); zombies[i].state = "IDLE"
        else: moved = zombie_move(i,z.target)'''
          new = '''func zombie_act(i: int):
    if zombies[i].dead: return
    var z = zombies[i]
    var sees_player := zombie_sees(z)
    if sees_player:
        if z.state != "CHASE": alert(i)
        z.state = "CHASE"
        z.target = player.pos
        z.heard = player.pos
    elif z.state == "CHASE":
        z.state = "INVESTIGATE"
        z.target = z.heard
    if sees_player and manhattan(z.pos,player.pos) == 1:
        z.facing = player.pos-z.pos; zombies[i]=z; zombie_attack(i); return
    var moved := false
    if z.state == "CHASE":
        zombies[i]=z; moved = zombie_move(i,z.target)
    elif z.heard != Vector2i(-1,-1):
        z.state = "INVESTIGATE"; z.target = z.heard; zombies[i]=z
        if z.pos == z.target:
            zombies[i].heard = Vector2i(-1,-1); zombies[i].state = "IDLE"
        else: moved = zombie_move(i,z.target)'''
          if old not in s: raise SystemExit('zombie_act block not found')
          s = s.replace(old, new, 1)

          old = '''    if not player_made:
        var heard = intensity - int(costs.get(player.pos,99999))
        if heard + awareness()*2.0 >= 14:
            var fuzz = 2 if heard < 30 else (1 if heard < 50 else 0)
            var approx = source + Vector2i(rng.randi_range(-fuzz,fuzz),rng.randi_range(-fuzz,fuzz))
            sound_marks.append({"pos":clamp_cell(approx),"label":label,"time":tick})
            while sound_marks.size()>5: sound_marks.pop_front()'''
          new = '''    if not player_made:
        var heard = intensity - int(costs.get(player.pos,99999))
        if heard + awareness()*2.0 >= 14:
            var band := "FAINT"
            if heard >= 50: band = "LOUD"
            elif heard >= 30: band = "CLEAR"
            sound_marks.append({"dir":compass_dir(player.pos,source),"label":label,"band":band,"time":tick})
            while sound_marks.size()>5: sound_marks.pop_front()'''
          if old not in s: raise SystemExit('sound block not found')
          s = s.replace(old, new, 1)

          old = '''func refresh_intents():
    intent_reads.clear(); var a=awareness()
    for i in range(zombies.size()):
        var z=zombies[i]
        if z.dead or not visible_cells.has(z.pos): continue
        if a < 2.2: intent_reads[i]="?"; continue
        var chance=clamp(.22+a*.075-float(player.fear)*.0035,.12,.93)
        if rng.randf()<=chance: intent_reads[i] = "HUNT" if z.state=="CHASE" else ("HEAR" if z.state=="INVESTIGATE" else "IDLE")
        else: intent_reads[i]=["IDLE","HEAR","HUNT","?"][rng.randi_range(0,3)]'''
          new = '''func refresh_intents():
    intent_reads.clear(); var a=awareness()
    for i in range(zombies.size()):
        var z=zombies[i]
        if z.dead:
            last_seen.erase(i)
            continue
        if visible_cells.has(z.pos):
            last_seen[i] = {"pos":z.pos,"time":tick}
            if z.state == "CHASE":
                intent_reads[i] = "! SEES YOU"
                continue
            if a < 2.2:
                intent_reads[i]="?"
                continue
            var chance=clamp(.22+a*.075-float(player.fear)*.0035,.12,.93)
            if rng.randf()<=chance: intent_reads[i] = "SEARCH" if z.state=="INVESTIGATE" else "IDLE"
            else: intent_reads[i]=["IDLE","SEARCH","?"][rng.randi_range(0,2)]
        elif last_seen.has(i):
            var remembered: Vector2i = last_seen[i].pos
            if visible_cells.has(remembered): last_seen.erase(i)'''
          if old not in s: raise SystemExit('intent block not found')
          s = s.replace(old, new, 1)

          marker = 'func clamp_cell(p:Vector2i)->Vector2i: return Vector2i(clamp(p.x,1,W-2),clamp(p.y,1,H-2))\n'
          helper = '''func compass_dir(from:Vector2i,to:Vector2i)->String:
    var d=to-from
    var sx=sign(d.x); var sy=sign(d.y)
    if sx==0 and sy<0: return "N"
    if sx>0 and sy<0: return "NE"
    if sx>0 and sy==0: return "E"
    if sx>0 and sy>0: return "SE"
    if sx==0 and sy>0: return "S"
    if sx<0 and sy>0: return "SW"
    if sx<0 and sy==0: return "W"
    if sx<0 and sy<0: return "NW"
    return "HERE"

'''
          if marker not in s: raise SystemExit('helper marker not found')
          s = s.replace(marker, marker + helper, 1)

          old = '''func draw_units():
    for z in zombies:
        if z.dead:
            var c=cell_to_screen(z.pos)+Vector2(TILE/2,TILE/2)
            draw_line(c+Vector2(-8,-5),c+Vector2(8,5),Color(.35,.08,.08),3)
            draw_line(c+Vector2(-8,5),c+Vector2(8,-5),Color(.35,.08,.08),3)
    for i in range(zombies.size()):
        var z=zombies[i]
        if z.dead or not visible_cells.has(z.pos): continue
        var c=cell_to_screen(z.pos)+Vector2(TILE/2,TILE/2)
        draw_circle(c,10,Color(.35,.52,.31)); arrow(c,z.facing,Color(.76,.90,.70),11)
        draw_string(font,c+Vector2(-13,-14),str(intent_reads.get(i,"?")),HORIZONTAL_ALIGNMENT_LEFT,-1,10,Color(1,.85,.38))
        if debug_ai: draw_string(font,c+Vector2(-12,27),"%s %d"%[z.state,int(z.next)-tick],HORIZONTAL_ALIGNMENT_LEFT,-1,8,Color.WHITE)'''
          new = '''func draw_units():
    for z in zombies:
        if z.dead and visible_cells.has(z.pos):
            var c=cell_to_screen(z.pos)+Vector2(TILE/2,TILE/2)
            draw_line(c+Vector2(-8,-5),c+Vector2(8,5),Color(.35,.08,.08),3)
            draw_line(c+Vector2(-8,5),c+Vector2(8,-5),Color(.35,.08,.08),3)
    for i in last_seen.keys():
        if i < 0 or i >= zombies.size(): continue
        var z=zombies[i]
        if z.dead or visible_cells.has(z.pos): continue
        var lp: Vector2i = last_seen[i].pos
        var lc=cell_to_screen(lp)+Vector2(TILE/2,TILE/2)
        draw_circle(lc,9,Color(.55,.58,.55,.55),false,2)
        draw_string(font,lc+Vector2(-11,-13),"LAST",HORIZONTAL_ALIGNMENT_LEFT,-1,8,Color(.65,.68,.65,.8))
    for i in range(zombies.size()):
        var z=zombies[i]
        if z.dead or not visible_cells.has(z.pos): continue
        var c=cell_to_screen(z.pos)+Vector2(TILE/2,TILE/2)
        draw_circle(c,10,Color(.35,.52,.31)); arrow(c,z.facing,Color(.76,.90,.70),11)
        var intent_text=str(intent_reads.get(i,"?"))
        var intent_color=Color(1,.32,.24) if z.state=="CHASE" else Color(1,.85,.38)
        if z.state=="CHASE": draw_circle(c,13,Color(1,.18,.12,.9),false,2)
        draw_string(font,c+Vector2(-20,-14),intent_text,HORIZONTAL_ALIGNMENT_LEFT,-1,9,intent_color)
        if debug_ai: draw_string(font,c+Vector2(-12,27),"%s %d"%[z.state,int(z.next)-tick],HORIZONTAL_ALIGNMENT_LEFT,-1,8,Color.WHITE)'''
          if old not in s: raise SystemExit('draw units block not found')
          s = s.replace(old, new, 1)

          old = '''func draw_sounds():
    for s in sound_marks:
        if tick-int(s.time)>650 or visible_cells.has(s.pos): continue
        var c=cell_to_screen(s.pos)+Vector2(TILE/2,TILE/2)
        draw_circle(c,8,Color(.95,.80,.28,.26),false,2)
        draw_circle(c,14,Color(.95,.80,.28,.16),false,1)
        draw_string(font,c+Vector2(-10,4),"SND",HORIZONTAL_ALIGNMENT_LEFT,-1,9,Color(.98,.85,.36))'''
          new = '''func draw_sounds():
    var recent:Array=[]
    for s in sound_marks:
        if tick-int(s.time)<=650: recent.append(s)
    var pc=cell_to_screen(player.pos)+Vector2(TILE/2,TILE/2)
    var shown=0
    for n in range(recent.size()-1,-1,-1):
        var s=recent[n]
        var yy=float(22+shown*12)
        draw_string(font,pc+Vector2(18,yy),"HEARD %s %s - %s"%[s.dir,s.band,s.label],HORIZONTAL_ALIGNMENT_LEFT,-1,9,Color(.98,.85,.36))
        shown+=1
        if shown>=2: break'''
          if old not in s: raise SystemExit('draw sound block not found')
          s = s.replace(old, new, 1)
          s = s.replace('"Green = visible zombie | SND = heard but unseen"', '"Green = visible | LAST = last seen | red ring = it sees you"', 1)
          p.write_text(s)
          PY
      - name: Commit perception pass
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/Main.gd
          git commit -m "Improve zombie tracking, intent, and sound clarity"
          git push
