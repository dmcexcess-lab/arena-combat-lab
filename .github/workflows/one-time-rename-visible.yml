name: One-time rename visible identifier

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Node2D visible collision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/Main.gd')
          s = p.read_text()
          s = s.replace('var visible := {}', 'var visible_cells := {}')
          s = s.replace('visible.has(', 'visible_cells.has(')
          s = s.replace('visible.clear()', 'visible_cells.clear()')
          s = s.replace('visible[p] = true', 'visible_cells[p] = true')
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/Main.gd
          git commit -m "Fix Node2D visible member collision"
          git push
