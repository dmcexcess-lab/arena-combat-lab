name: Clean build marker
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove temporary marker and workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .build-refresh .github/workflows/cleanup-refresh.yml
          git config user.name 'arena-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Clean build marker'
          git push origin HEAD:main
