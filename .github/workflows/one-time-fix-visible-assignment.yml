name: One-time fix visible assignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining visibility assignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/Main.gd')
          s = p.read_text()
          s = s.replace('visible[p]=true', 'visible_cells[p]=true')
          s = s.replace('visible[p] = true', 'visible_cells[p] = true')
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/Main.gd
          git commit -m "Fix remaining visibility assignment"
          git push
