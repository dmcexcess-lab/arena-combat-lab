name: One-time alpha readability fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stale FOV and sound markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/Main.gd')
          s = p.read_text()
          old = '                msg = "Crouched: quieter, slower." if player.crouched else "Standing."\n                queue_redraw()'
          new = '                msg = "Crouched: quieter, slower." if player.crouched else "Standing."\n                recalc_visibility()\n                refresh_intents()\n                queue_redraw()'
          if old not in s: raise SystemExit('crouch block not found')
          s = s.replace(old, new, 1)
          old = 'func try_move(dir: Vector2i, sprint: bool):\n    var dest: Vector2i = player.pos + dir\n    player.facing = dir\n    if blocked(dest) or zombie_at(dest) != -1:\n        msg = "Blocked."\n        player.move_state = "STILL"\n        queue_redraw(); return'
          new = 'func try_move(dir: Vector2i, sprint: bool):\n    var dest: Vector2i = player.pos + dir\n    player.facing = dir\n    recalc_visibility()\n    refresh_intents()\n    var blocker := zombie_at(dest)\n    if blocked(dest) or blocker != -1:\n        msg = "A zombie blocks the way." if blocker != -1 and visible_cells.has(dest) else "Blocked."\n        player.move_state = "STILL"\n        queue_redraw(); return'
          if old not in s: raise SystemExit('try_move block not found')
          s = s.replace(old, new, 1)
          old = '        draw_circle(c,10,Color(.95,.80,.28,.20),false,2); draw_string(font,c+Vector2(-4,5),"?",HORIZONTAL_ALIGNMENT_LEFT,-1,14,Color(.98,.85,.36))'
          new = '        draw_circle(c,8,Color(.95,.80,.28,.26),false,2)\n        draw_circle(c,14,Color(.95,.80,.28,.16),false,1)\n        draw_string(font,c+Vector2(-10,4),"SND",HORIZONTAL_ALIGNMENT_LEFT,-1,9,Color(.98,.85,.36))'
          if old not in s: raise SystemExit('sound marker block not found')
          s = s.replace(old, new, 1)
          old = '    draw_string(font,Vector2(x,y),"R new run | F1 AI debug",HORIZONTAL_ALIGNMENT_LEFT,-1,12,Color(.78,.8,.78))'
          new = '    draw_string(font,Vector2(x,y),"R new run | F1 AI debug",HORIZONTAL_ALIGNMENT_LEFT,-1,12,Color(.78,.8,.78)); y+=18\n    draw_string(font,Vector2(x,y),"Green = visible zombie | SND = heard but unseen",HORIZONTAL_ALIGNMENT_LEFT,-1,11,Color(.68,.72,.68))'
          if old not in s: raise SystemExit('hud line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/Main.gd
          git commit -m "Fix stale FOV and clarify sound markers"
          git push
