name: Apply alpha systems pass
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install prepared source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          get_blob() {
            local sha="$1"
            local path="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" > /tmp/blob.json
            python - "$path" <<'PY'
          import base64, json, pathlib, sys
          obj = json.load(open('/tmp/blob.json'))
          path = pathlib.Path(sys.argv[1])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(obj['content']))
          PY
          }
          get_blob a07aae08cbeece626dec78f81f4097500dacfb44 scripts/MainAlphaWeapons.gd
          get_blob fac5d1ce7c985d790db3a6b48e4e609097afc036 scripts/MainAlphaAI.gd
          get_blob 8c216ab2615b107fbae54fcb7187fc41066fe91a main.tscn
          get_blob e9d69d1dbb16c5174140d12410dd3460ae001677 CHANGELOG.md
          rm -rf .alpha_tmp
          rm -f .github/workflows/apply-alpha-pass.yml
      - name: Commit final pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'arena-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add weapon identities and Walker awareness'
          git push origin HEAD:main
